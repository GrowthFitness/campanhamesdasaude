<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacote de Implementação: Campanha Mês da Saúde</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f0f0f;
    color: white;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .page {
    max-width: 680px;
    width: 100%;
    text-align: center;
  }

  h1 {
    font-size: clamp(22px, 4vw, 36px);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1px;
    line-height: 1.25;
    margin-bottom: 32px;
    color: #ffffff;
  }

  h1 span { color: #25c26e; }

  .video-wrapper {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    overflow: hidden;
    border-radius: 10px;
    margin-bottom: 20px;
  }

  .video-wrapper iframe {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
    border-radius: 10px;
  }

  .price {
    font-size: 20px;
    color: #ffffff;
    margin-bottom: 28px;
  }

  .cta-btn {
    display: inline-block;
    background: #25c26e;
    color: white;
    font-size: 20px;
    font-weight: 800;
    text-decoration: none;
    padding: 20px 56px;
    border-radius: 100px;
    text-transform: uppercase;
    letter-spacing: 1px;
    width: 100%;
    transition: background 0.15s;
  }

  .cta-btn:hover { background: #1fa85e; }
</style>
</head>
<body>
<div class="page">
  <h1>Pacote de Implementação:<br><span>Campanha Mês da Saúde</span></h1>

  <div class="video-wrapper">
    <iframe
      src="https://player-vz-d0abe256-8c2.tv.pandavideo.com/embed/?v=0aa14aa2-2e7c-4a78-b045-7d8db7209b47"
      allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>

  <p class="price">Apenas R$37</p>

  <a href="https://chk.eduzz.com/u7x5nxwj" class="cta-btn" target="_blank">
    Comprar agora
  </a>
</div>
</body>
</html>
